<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111415">
  <title>MOTOR EMPIRE — Geliştirici görsel denetimi</title>
  <link rel="stylesheet" href="./style.css?v=0.15.4">
  <script type="module" src="./visual-audit.mjs?v=0.15.4"></script>
</head>
<body>
  <header class="top"><div class="shell top-inner"><a class="brand" href="./?dev=1">MOTOR <b>EMPIRE</b></a><span class="version">0.15</span></div></header>
  <main class="shell">
    <h1>Geliştirici görsel denetimi</h1>
    <div class="audit-controls">
      <label>Boya rengi <select id="audit-color" class="audit-select"></select></label>
      <label><input id="audit-baseline" type="checkbox"> v0.5 çizimlerini göster</label>
    </div>
    <p id="audit-summary" class="notice" role="status"></p>
    <section class="audit-grid" id="audit-grid" aria-label="100 motosikletin karşılaştırması"></section>
  </main>
</body>
</html>
